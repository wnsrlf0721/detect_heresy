projects:
  - name: Detect Heresy
    environments:
      - name: Staging
        services:
          - type: pserv
            name: detect-heresy-api
            runtime: docker
            plan: 0.5c-512mb
            region: singapore
            dockerContext: .
            dockerfilePath: ./backend/Dockerfile
            autoDeployTrigger: "off"
            envVars:
              - key: PORT
                value: "8000"
              - key: DATABASE_URL
                fromDatabase:
                  name: detect-heresy-db
                  property: connectionString
          - type: web
            name: detect-heresy-web
            runtime: docker
            plan: free
            region: singapore
            dockerContext: ./frontend
            dockerfilePath: ./frontend/Dockerfile
            autoDeployTrigger: "off"
            healthCheckPath: /api/health
            envVars:
              - key: PORT
                value: "3000"
              - key: API_INTERNAL_HOSTPORT
                fromService:
                  type: pserv
                  name: detect-heresy-api
                  property: hostport
        databases:
          - name: detect-heresy-db
            plan: free
            region: singapore
            postgresMajorVersion: "17"
            ipAllowList: []
