<!doctype html>
<html lang="ko">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이단성 분석</title>
  <link rel="stylesheet" href="popup.css">
  <main>
    <h1>이단성 분석</h1>
    <p id="disclosure">활성화하면 재생한 유튜브 영상의 주소를 분석 서버에 보내고, 서버에 추출 텍스트와 분석 결과를 저장합니다.</p>
    <label>
      <input id="enabled" type="checkbox" aria-describedby="disclosure" disabled>
      동의하고 자동 분석 켜기
    </label>
    <p id="status" role="status">상태를 불러오는 중…</p>
    <ul id="progress" aria-label="진행 중인 영상"></ul>
    <a id="result" target="_blank" rel="noopener" hidden>최근 결과 보기</a>
  </main>
  <script src="site.js"></script>
  <script src="popup.js"></script>
</html>
