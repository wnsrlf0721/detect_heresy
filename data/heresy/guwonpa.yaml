# 구원파 계열 교리 사례 초안. 계파별 차이가 있으므로 교단 결의문·이단 상담 자료와 대조해
# source 를 채우고 verified: true 로 바꾼다.
- id: gwp-realization
  group: 구원파
  topic: soteriology
  claim: >-
    죄 사함의 비밀을 깨달아야 구원을 받는다. 구원받은 사람은 자신이 거듭난 날짜와 시간을 알고 있어야
    하며, 그것을 모른다면 아직 구원받지 못한 것이다.
  keywords: [깨달음, 죄 사함의 비밀, 구원받은 날짜, 거듭난 날, 구원의 확신]
  intent: >-
    기존 신자에게 자신의 구원을 의심하게 만들어, 단체의 집회에서 '깨닫는' 경험을 해야만 구원받은
    것으로 여기게 한다.
  refutation: >-
    구원은 어떤 사실을 깨닫는 지식이나 체험의 날짜에 달려 있지 않고, 하나님의 은혜로 그리스도를 믿는
    믿음을 통해 받는다. 구원의 확신은 거듭난 시각을 아는 데서가 아니라 그리스도의 약속에서 나온다.
  orthodox_refs: [wsc-33]
  scripture: ["엡 2:8-9", "롬 10:9-10", "요 3:8"]
  source: null
  verified: false

- id: gwp-no-repentance
  group: 구원파
  topic: soteriology
  claim: >-
    구원받을 때 과거, 현재, 미래의 죄가 모두 사해졌으므로 구원받은 사람은 더 이상 회개할 필요가 없다.
    계속 죄를 고백하고 회개하는 것은 구원받지 못했다는 증거이다.
  keywords: [회개 불필요, 반복 회개, 죄인이 아니라 의인, 과거 현재 미래의 죄, 주기도문]
  intent: >-
    기성교회의 회개와 죄 고백을 구원받지 못한 증거로 몰아 기존 신앙을 부정하게 하고, 단체의 구원관만
    옳다고 믿게 한다.
  refutation: >-
    칭의는 단번에 이루어지지만 신자는 성화의 과정에서 여전히 죄와 싸우며, 성경은 신자에게 죄를
    고백하라고 가르친다. 회개는 구원받지 못한 증거가 아니라 구원받은 자에게 주어지는 은혜이다.
  orthodox_refs: [wsc-87, wsc-35]
  scripture: ["요일 1:8-9", "마 6:12", "약 5:16"]
  source: null
  verified: false

- id: gwp-anti-church
  group: 구원파
  topic: ecclesiology
  claim: >-
    기성교회에는 구원이 없다. 교회에 다니며 예배하고 기도하고 헌금하는 것은 율법에 매인 종교생활일
    뿐이며, 죄 사함의 비밀을 깨달은 사람들의 모임만이 참된 교회이다.
  keywords: [종교생활, 율법, 기성교회, 참된 교회, 복음과 종교]
  intent: >-
    신자가 다니던 교회의 예배와 신앙생활을 무가치한 것으로 여기게 해 교회를 떠나 단체로 옮기게 한다.
  refutation: >-
    예배와 기도, 성도의 교제는 율법주의가 아니라 은혜받은 자의 마땅한 삶이다. 그리스도의 교회는
    특정 단체에 한정되지 않으며, 그리스도를 머리로 하는 모든 성도로 이루어진다.
  orthodox_refs: [wcf-25-1, wsc-35]
  scripture: ["히 10:25", "행 2:42", "엡 1:22-23"]
  source: null
  verified: false
