# 신천지 교리 사례 초안. 교단 결의문·이단 상담 자료와 대조해 source 를 채우고 verified: true 로 바꾼다.
- id: scj-parable
  group: 신천지
  topic: revelation
  claim: >-
    성경은 비유로 봉함되어 있어서 짝이 되는 구절로 풀어야만 뜻을 알 수 있다. 씨는 말씀, 밭은 사람의
    마음, 나무는 사람, 새는 영, 보석은 말씀 가진 사람과 같이 정해진 풀이가 있으며, 이 비유를 깨닫지
    못하면 죄 사함도 구원도 받지 못한다.
  keywords: [비유풀이, 짝풀이, 봉함된 말씀, 씨, 밭, 나무, 새, 보석, 감추인 만나]
  intent: >-
    정해진 풀이 공식을 익히게 해 성경 해석의 권한을 단체가 독점하고, 기존에 배운 것을 버리게 한 뒤
    '약속의 목자' 교리로 이끌기 위한 입문 단계이다.
  refutation: >-
    비유는 각 본문의 문맥 안에서 해석해야 하며, 단어마다 고정된 뜻을 대입하는 공식은 성경에 없다.
    성경 해석의 규칙은 성경 자체이고, 구원은 비유를 깨닫는 지식이 아니라 그리스도를 믿는 믿음으로 받는다.
  orthodox_refs: [wcf-1-9, wsc-33]
  scripture: ["마 13:10-23", "엡 2:8-9"]
  source: null
  verified: false

- id: scj-promised-pastor
  group: 신천지
  topic: christology
  claim: >-
    예수께서 약속하신 보혜사는 오늘날 육체로 온 한 사람, 곧 계시록의 '이긴 자'이자 '약속의 목자'이다.
    계시록의 사건을 보고 들은 유일한 증인인 그에게 가야만 계시의 말씀을 받고 구원에 이를 수 있다.
  keywords: [약속의 목자, 이긴 자, 보혜사, 대언자, 사도 요한 격 사명자, 계시의 말씀]
  intent: >-
    교주를 구원에 꼭 필요한 중보자로 세워 그리스도와 성령의 자리에 두고, 신도가 교주와 단체에
    전적으로 의존하게 만든다.
  refutation: >-
    예수께서 약속하신 보혜사는 성령이시며 사람이 아니다. 하나님과 사람 사이의 중보자와 구속자는
    오직 예수 그리스도 한 분이시고, 다른 이름으로는 구원을 받을 수 없다.
  orthodox_refs: [wsc-21, apostles-creed-3]
  scripture: ["요 14:16-17", "요 14:26", "딤전 2:5", "행 4:12"]
  source: null
  verified: false

- id: scj-betrayal-destruction-salvation
  group: 신천지
  topic: ecclesiology
  claim: >-
    계시록은 배도, 멸망, 구원의 순서로 성취된다. 처음 택함 받은 장막이 배도하여 멸망자에게 멸망당했고
    그 뒤에 구원자가 나타났다. 오늘날 기성교회는 배도하여 멸망받은 바벨론이므로 거기서 나와 구원의
    처소로 옮겨야 한다.
  keywords: [배도, 멸망, 구원, 배멸구, 바벨론, 추수, 알곡과 가라지, 장막성전]
  intent: >-
    기성교회 전체를 구원 없는 곳으로 규정해 신도가 다니던 교회를 떠나게 하고, 자기 단체만을 유일한
    구원의 처소로 받아들이게 한다.
  refutation: >-
    교회의 머리는 그리스도이시며, 주께서 세우신 교회는 음부의 권세가 이기지 못한다. 교회에 허물이
    있다는 것과 교회 전체가 배도하여 구원이 없다는 주장은 다르며, 특정 단체만이 구원의 처소라는
    가르침은 성경에 근거가 없다.
  orthodox_refs: [wcf-25-1, apostles-creed-3]
  scripture: ["마 16:18", "엡 1:22-23", "살후 2:3"]
  source: null
  verified: false

- id: scj-fulfilled-reality
  group: 신천지
  topic: revelation
  claim: >-
    계시록의 예언은 오늘날 이 땅의 특정 장소와 인물, 사건으로 이미 이루어졌다. 이 '실상'을 알고 믿어야
    구원을 받으며, 실상을 증거하는 말씀은 한 곳에서만 들을 수 있다.
  keywords: [실상, 계시록 성취, 예언과 실상, 새 언약, 증거의 말씀, 열린 책]
  intent: >-
    단체의 내부 역사를 성경 예언의 성취로 포장해 교주의 해석에 성경과 같은 권위를 부여하고,
    외부에서는 검증할 수 없는 주장을 구원의 조건으로 삼는다.
  refutation: >-
    구원에 필요한 하나님의 뜻은 성경에 온전히 기록되어 있어 새로운 계시로 아무것도 더할 수 없다.
    성경 밖의 특정 사건을 알아야 구원받는다는 주장은 성경에 다른 것을 더하는 것이다.
  orthodox_refs: [wcf-1-6, wsc-2]
  scripture: ["계 22:18-19", "갈 1:8-9"]
  source: null
  verified: false

- id: scj-144000
  group: 신천지
  topic: eschatology
  claim: >-
    인 맞은 십사만 사천 명이 채워지면 순교자의 영이 그들의 육체에 임해 하나가 되고(신인합일),
    그들은 죽지 않고 이 땅에서 영원히 살며 왕 같은 제사장으로 다스린다.
  keywords: [십사만 사천, "144000", 인 맞음, 신인합일, 육체영생, 왕 같은 제사장, 흰 무리]
  intent: >-
    정해진 숫자 안에 들어야 한다는 불안과 죽지 않는다는 기대를 함께 심어, 포교와 단체 활동에
    몰두하게 만든다.
  refutation: >-
    성경은 몸의 부활과 영원한 생명을 가르치지만, 특정 단체의 정원에 들면 육체가 죽지 않는다고
    가르치지 않는다. 구원받은 무리는 셀 수 없는 큰 무리이며, 주께서 오실 날은 사람에게 알려지지 않았다.
  orthodox_refs: [apostles-creed-3, wcf-33-3]
  scripture: ["계 7:9", "히 9:27", "고전 15:51-53"]
  source: null
  verified: false
