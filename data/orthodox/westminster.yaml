# 웨스트민스터 소요리문답 / 신앙고백 발췌.
# 본문은 원문의 뜻을 옮긴 초안이며 공인 번역이 아니다. 교단 공인 번역본과 대조 후 verified: true 로 바꾼다.
- id: wsc-2
  source: 웨스트민스터 소요리문답
  section: 제2문
  topic: revelation
  text: >-
    신구약 성경에 기록된 하나님의 말씀이, 우리가 어떻게 하나님을 영화롭게 하고 즐거워할 것인지를
    지시하는 유일한 규칙이다.
  scripture: ["딤후 3:16", "엡 2:20"]
  verified: false

- id: wsc-6
  source: 웨스트민스터 소요리문답
  section: 제6문
  topic: trinity
  text: >-
    하나님의 신격에는 성부, 성자, 성령 삼위가 계시며, 이 삼위는 한 하나님이시고,
    본체가 같으며 권능과 영광이 동등하시다.
  scripture: ["마 28:19", "고후 13:13"]
  verified: false

- id: wsc-21
  source: 웨스트민스터 소요리문답
  section: 제21문
  topic: christology
  text: >-
    하나님께서 택하신 자들의 유일한 구속자는 주 예수 그리스도이시다. 그는 하나님의 영원한 아들로서
    사람이 되셨고, 그리하여 한 위격 안에 구별된 두 본성을 지니신 하나님이자 사람이시며 영원히 그러하시다.
  scripture: ["딤전 2:5", "요 1:14", "행 4:12"]
  verified: false

- id: wsc-33
  source: 웨스트민스터 소요리문답
  section: 제33문
  topic: soteriology
  text: >-
    칭의는 하나님께서 값없이 베푸시는 은혜의 행위로서, 우리의 모든 죄를 용서하시고 우리를 그분 앞에서
    의로운 자로 받아 주시는 것이다. 이는 오직 우리에게 전가된 그리스도의 의 때문이며, 믿음으로만 받는다.
  scripture: ["롬 3:24", "엡 2:8-9", "갈 2:16"]
  verified: false

- id: wsc-35
  source: 웨스트민스터 소요리문답
  section: 제35문
  topic: soteriology
  text: >-
    성화는 하나님께서 값없이 베푸시는 은혜의 사역으로서, 우리가 전인격적으로 하나님의 형상을 따라
    새롭게 되고, 점점 더 죄에 대하여는 죽고 의에 대하여는 살 수 있게 되는 것이다.
  scripture: ["살후 2:13", "엡 4:23-24", "롬 6:11"]
  verified: false

- id: wsc-87
  source: 웨스트민스터 소요리문답
  section: 제87문
  topic: soteriology
  text: >-
    생명에 이르는 회개는 구원의 은혜로서, 죄인이 자기 죄를 참으로 깨닫고 그리스도 안에 있는 하나님의
    자비를 알아, 자기 죄를 슬퍼하고 미워하며 죄에서 떠나 하나님께로 돌이켜, 새로운 순종을 온전히
    결심하고 힘쓰는 것이다.
  scripture: ["행 11:18", "요일 1:8-9", "마 6:12"]
  verified: false

- id: wcf-1-6
  source: 웨스트민스터 신앙고백
  section: 제1장 6항
  topic: revelation
  text: >-
    하나님의 영광과 사람의 구원, 믿음과 삶에 필요한 모든 것에 관한 하나님의 온전한 뜻은 성경에 명백히
    기록되어 있거나 성경에서 합당하게 추론할 수 있다. 여기에는 성령의 새로운 계시로든 사람의 전통으로든
    어느 때에도 아무것도 더할 수 없다.
  scripture: ["딤후 3:15-17", "갈 1:8-9", "계 22:18-19"]
  verified: false

- id: wcf-1-9
  source: 웨스트민스터 신앙고백
  section: 제1장 9항
  topic: revelation
  text: >-
    성경 해석의 무오한 규칙은 성경 자체이다. 그러므로 어떤 성경 구절의 참되고 완전한 뜻에 대해 의문이
    있을 때에는, 더 분명하게 말하는 다른 구절들을 통해 살피고 알아야 한다.
  scripture: ["벧후 1:20-21", "행 15:15-16"]
  verified: false

- id: wcf-25-1
  source: 웨스트민스터 신앙고백
  section: 제25장 1항
  topic: ecclesiology
  text: >-
    보이지 않는 보편 교회는 머리이신 그리스도 아래 과거에도 현재에도 미래에도 하나로 모이는 택함 받은
    자들의 전체로 이루어지며, 그리스도의 신부요 몸이다.
  scripture: ["엡 1:22-23", "골 1:18", "마 16:18"]
  verified: false

- id: wcf-33-3
  source: 웨스트민스터 신앙고백
  section: 제33장 3항
  topic: eschatology
  text: >-
    그리스도께서는 심판의 날이 있을 것을 우리가 확실히 믿기를 원하시지만, 그날을 사람들에게 알리지
    않으셨다. 이는 사람들이 주께서 언제 오실지 알지 못하므로 모든 육적인 안일함을 버리고 항상 깨어
    있게 하시려는 것이다.
  scripture: ["마 24:36", "마 24:42-44", "막 13:35-37"]
  verified: false
