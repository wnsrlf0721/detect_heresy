# 사도신경 (전통 번역). 교단 공인 본문과 대조 후 verified: true 로 바꾼다.
- id: apostles-creed-1
  source: 사도신경
  section: 성부
  topic: trinity
  text: 전능하사 천지를 만드신 하나님 아버지를 내가 믿사오며,
  verified: false

- id: apostles-creed-2
  source: 사도신경
  section: 성자
  topic: christology
  text: >-
    그 외아들 우리 주 예수 그리스도를 믿사오니, 이는 성령으로 잉태하사 동정녀 마리아에게 나시고,
    본디오 빌라도에게 고난을 받으사, 십자가에 못 박혀 죽으시고, 장사한 지 사흘 만에 죽은 자 가운데서
    다시 살아나시며, 하늘에 오르사, 전능하신 하나님 우편에 앉아 계시다가, 저리로서 산 자와 죽은 자를
    심판하러 오시리라.
  verified: false

- id: apostles-creed-3
  source: 사도신경
  section: 성령·교회·종말
  topic: ecclesiology
  text: >-
    성령을 믿사오며, 거룩한 공회와, 성도가 서로 교통하는 것과, 죄를 사하여 주시는 것과,
    몸이 다시 사는 것과, 영원히 사는 것을 믿사옵나이다.
  verified: false
