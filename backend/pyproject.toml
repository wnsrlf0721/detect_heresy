[project]
name = "detect-heresy-backend"
version = "0.1.0"
description = "이단성 분석 서비스 백엔드"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.8.19",
]

[project.optional-dependencies]
local = [
    "easyocr>=1.7.2",
    "faster-whisper>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
