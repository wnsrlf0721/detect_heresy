services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: heresy
      POSTGRES_PASSWORD: heresy
      POSTGRES_DB: heresy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heresy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
