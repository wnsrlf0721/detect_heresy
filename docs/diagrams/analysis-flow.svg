<text x="67" y="106" fill="#43556D" font-family="Noto Sans CJK KR, Noto Sans KR, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">FastAPI가 분석을 접수하고, 후속 조회에서 저장된 결과를 반환합니다.</text>
