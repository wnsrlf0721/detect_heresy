<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="895" viewBox="0 0 1320 895" role="img" aria-labelledby="title desc">
<title id="title">텍스트와 영상 분석 흐름</title>
<desc id="desc">FastAPI가 분석을 접수하고, 후속 조회에서 저장된 결과를 반환합니다.</desc>
